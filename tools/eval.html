<!doctype html>
<meta charset="utf-8">
<title>分类准确率</title>
<input type="file" id="files" multiple>
<p id="status"></p>
<script type="module">
// 由 tools/eval.mjs 打开并选入样本。流程与应用一致：缩到 1024 → RMBG 抠图 → 白底 → SigLIP 图像模型 → 对全部打分项排序
import { downscaleBitmap } from '/image.js';
import { MATTING_MODEL, CLASSIFY_MODEL } from '/config.js';
const status = (t) => { document.getElementById('status').textContent = t; };

function call(w, msg, transfer = []) {
  return new Promise((ok, fail) => {
    w.onmessage = ({ data }) => (data.ok ? ok(data) : fail(new Error(data.error)));
    w.onerror = (e) => fail(new Error(e.message || 'Worker 出错'));
    w.postMessage({ id: Date.now(), ...msg }, transfer);
  });
}

document.getElementById('files').addEventListener('change', async (e) => {
  try {
    const files = [...e.target.files];
    const labels = (await (await fetch('/label-embeddings.json')).json()).labels;
    // 1. 抠图（一个 Worker 跑完全部，Mac 内存够）
    let w = new Worker('/model-worker.js', { type: 'module' });
    await call(w, { type: 'init', task: 'matting', ...MATTING_MODEL, modelId: MATTING_MODEL.id });
    const cutouts = [];
    for (const [i, f] of files.entries()) {
      status(`抠图 ${i + 1}/${files.length}`);
      const bitmap = await downscaleBitmap(f);
      cutouts.push((await call(w, { type: 'run', bitmap, thumbSide: 64 }, [bitmap])).cutout);
    }
    await call(w, { type: 'dispose' }); w.terminate();
    // 2. 分类
    w = new Worker('/model-worker.js', { type: 'module' });
    const ready = await call(w, { type: 'init', task: 'classify', ...CLASSIFY_MODEL, modelId: CLASSIFY_MODEL.id, labels });
    const results = [];
    for (const [i, blob] of cutouts.entries()) {
      status(`分类 ${i + 1}/${files.length}`);
      const bitmap = await createImageBitmap(blob);
      const r = await call(w, { type: 'run', bitmap }, [bitmap]);
      results.push({ name: files[i].name, ranked: r.ranked.slice(0, 5), ms: r.ms });
    }
    w.terminate();
    window.__result = { backend: `${ready.device}/${ready.dtype}`, results };
  } catch (err) { window.__result = { error: String(err?.message ?? err) }; }
});
document.documentElement.dataset.ready = '1';
</script>
