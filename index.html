<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>衣橱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衣橱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#74acdf">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.0 7.5L16.0 1.0M19.3 8.1L20.8 4.5M22.0 10.0L26.6 5.4M23.9 12.7L27.5 11.2M24.5 16.0L31.0 16.0M23.9 19.3L27.5 20.8M22.0 22.0L26.6 26.6M19.3 23.9L20.8 27.5M16.0 24.5L16.0 31.0M12.7 23.9L11.2 27.5M10.0 22.0L5.4 26.6M8.1 19.3L4.5 20.8M7.5 16.0L1.0 16.0M8.1 12.7L4.5 11.2M10.0 10.0L5.4 5.4M12.7 8.1L11.2 4.5" stroke="#f6b40e" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="6.5" fill="#f6b40e" stroke="#85340a" stroke-width="1"/></svg>衣橱</h1>
  <p id="storage" class="muted">存储：检查中…</p>
</header>

<main>
  <label class="primary" id="addLabel">
    ＋ 录入衣物
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </label>

  <section id="pending" aria-label="待保存"></section>

  <section id="closet" aria-label="衣橱"></section>
  <p id="empty" class="muted" hidden>还没有衣物。点"录入衣物"拍照或选择图片。</p>

  <label class="toggle"><input type="checkbox" id="showArchived"> 显示已归档</label>
  <section id="archived" aria-label="已归档" hidden></section>

  <details id="about">
    <summary>关于</summary>
    <p>衣物照片和信息只保存在本机浏览器里，不上传。</p>
    <p>后续版本的应用内抠图将使用 <a href="https://huggingface.co/briaai/RMBG-1.4">RMBG-1.4</a>（Bria，非商用许可，仅限个人非商用使用）。</p>
    <p id="diag" class="muted"></p>
  </details>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm"></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
