<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>衣橱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衣橱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>衣橱</h1>
  <p id="storage" class="muted">存储：检查中…</p>
</header>

<main>
  <label class="primary" id="addLabel">
    ＋ 录入衣物
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </label>

  <section id="pending" aria-label="待保存"></section>

  <section id="closet" aria-label="衣橱"></section>
  <p id="empty" class="muted" hidden>还没有衣物。点"录入衣物"拍照或选择图片。</p>

  <label class="toggle"><input type="checkbox" id="showArchived"> 显示已归档</label>
  <section id="archived" aria-label="已归档" hidden></section>

  <details id="about">
    <summary>关于</summary>
    <p>衣物照片和信息只保存在本机浏览器里，不上传。</p>
    <p>后续版本的应用内抠图将使用 <a href="https://huggingface.co/briaai/RMBG-1.4">RMBG-1.4</a>（Bria，非商用许可，仅限个人非商用使用）。</p>
    <p id="diag" class="muted"></p>
  </details>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm"></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
